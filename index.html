<style>
/* Layout: one phone-width app column, centered on desktop. Tabs: Tonight, Map, Trip, Safety. Riders choose; hosts post plans. */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#E3E8E1; --ink:#14201A; --ink-2:#51605A; --line:#CBD3CA;
  --accent:#9A5F08; --accent-ink:#FFFFFF; --accent-soft:#F1E2C6;
  --good:#1B7A4B; --good-soft:#D6EBDD; --bad:#C0352B; --bad-ink:#FFFFFF; --bad-soft:#F6D9D5; --me:#1769AA;
  --m-land:#E6EAE3; --m-park:#D2E3CC; --m-road:#FFFFFF; --m-major:#F6E9CF; --m-water:#BFD6E0; --m-text:#5C6A63; --m-halo:#E6EAE3;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B110F; --surface:#121A17; --surface-2:#1A2420; --ink:#EBF0EA; --ink-2:#98A79F; --line:#26332D;
    --accent:#EDB44E; --accent-ink:#1B1204; --accent-soft:#2B2311;
    --good:#4CC98A; --good-soft:#12301F; --bad:#FF6F61; --bad-ink:#1C0705; --bad-soft:#3A1714; --me:#5BB0F0;
    --m-land:#0F1613; --m-park:#14211A; --m-road:#1C2823; --m-major:#2A2A1E; --m-water:#0E2230; --m-text:#7C8C84; --m-halo:#0F1613;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B110F; --surface:#121A17; --surface-2:#1A2420; --ink:#EBF0EA; --ink-2:#98A79F; --line:#26332D;
  --accent:#EDB44E; --accent-ink:#1B1204; --accent-soft:#2B2311;
  --good:#4CC98A; --good-soft:#12301F; --bad:#FF6F61; --bad-ink:#1C0705; --bad-soft:#3A1714; --me:#5BB0F0;
  --m-land:#0F1613; --m-park:#14211A; --m-road:#1C2823; --m-major:#2A2A1E; --m-water:#0E2230; --m-text:#7C8C84; --m-halo:#0F1613;

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line);position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo i{display:flex;gap:3px}
.logo i b{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.view{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.view>*{flex:none;width:100%;max-width:1040px;margin-inline:auto}
.sheet>*{flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:700;color:var(--ink-2);position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--accent)}
.tabs .dot{position:absolute;top:7px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--good)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:28px;line-height:1.05;font-weight:800}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
.hero{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rule{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--good-soft);color:var(--ink);font-size:13px}
.rule .ic{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/8.5;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 15% 100%,hsl(var(--h) 70% 45% / .55),transparent 60%),radial-gradient(90% 80% at 90% 0%,hsl(calc(var(--h) + 40) 60% 50% / .35),transparent 60%),linear-gradient(170deg,#101816,#1B2622)}
.thumb .car{position:absolute;left:50%;bottom:6%;width:62%;transform:translateX(-50%);opacity:.95}
.thumb .tl{position:absolute;top:10px;left:10px;right:110px;display:flex;gap:6px;flex-wrap:wrap}
.thumb .tr{position:absolute;top:10px;right:10px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(10,14,12,.62);color:#fff;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.tag.crew{background:var(--accent);color:var(--accent-ink);font-size:12px}
.play{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#101816;font-weight:700;font-size:12px}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.name{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.vbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;background:var(--good-soft);color:var(--good);font-size:11px;font-weight:700}
.vbadge.pending{background:var(--accent-soft);color:var(--accent)}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.rating .ic{color:var(--accent)}
.avs{display:flex}
.av{position:relative;display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);flex:none}
.avs .av+.av{margin-left:-8px}
.av svg.p{display:block;width:100%;height:100%;border-radius:50%}
.av .okb{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--good);color:var(--bg);display:grid;place-items:center;border:2px solid var(--surface)}
.av img.p{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.tag.fit{background:var(--good);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pp{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px;min-width:0}
.pp b{overflow-wrap:anywhere}
.req{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sub{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.crewline{display:flex;align-items:center;gap:10px}
.legs{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--ink-2)}
.legs b{color:var(--ink);font-weight:700}
.legs .arrow{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--bad-ink)}
.btn.sm{padding:8px 12px;font-size:12px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.mono{font-family:var(--f-mono);font-weight:700}
.plate{display:inline-block;padding:5px 11px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.06em}
.map-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--m-land);position:relative}
svg.map{display:block;width:100%;height:auto}
.m-land{fill:var(--m-land)} .m-park{fill:var(--m-park)} .m-water{fill:var(--m-water)}
.m-road{stroke:var(--m-road);stroke-width:3;fill:none} .m-major{stroke:var(--m-major);stroke-width:6;fill:none}
.m-route-bg{stroke:var(--accent);stroke-opacity:.28;stroke-width:9;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m-route{stroke:var(--accent);stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m-trail{stroke:var(--ink-2);stroke-opacity:.6;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m-dev{stroke:var(--bad);stroke-width:3;stroke-dasharray:6 5;fill:none}
.m-text{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round}
.m-dist{font-family:var(--f-body);font-weight:700;letter-spacing:.14em;fill:var(--m-text);opacity:.75}
.m-fuzz{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1.5}
.hit{cursor:pointer}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.3}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start}
.stop{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.stop .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);font-weight:700;font-size:12px;color:var(--accent);background:var(--surface)}
.stop.done .n{background:var(--good);border-color:var(--good);color:var(--bg)}
.stop.skip{opacity:.45}
.stop small{color:var(--ink-2);display:block}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.sw{width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.stepper b{min-width:18px;text-align:center;font-family:var(--f-mono)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2)}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.live{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.sos{padding:9px 16px;border-radius:999px;background:var(--bad);color:var(--bad-ink);font-weight:800;letter-spacing:.06em;font-size:13px}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12px}
.log li{display:flex;gap:8px;color:var(--ink-2)}
.log li b{font-family:var(--f-mono);font-weight:500;color:var(--ink-2);flex:none}
.log li.bad{color:var(--bad)}
.log li.good{color:var(--good)}
.status{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.status .btn{width:auto}
.empty{text-align:left;display:flex;flex-direction:column;gap:10px;padding:20px;border:1px dashed var(--line);border-radius:16px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}
.inp{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{width:100%;max-height:93%;background:var(--surface);border-radius:20px 20px 0 0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.alert{border-radius:14px;padding:14px;background:var(--bad-soft);color:var(--ink);display:flex;flex-direction:column;gap:6px}

  background:radial-gradient(100% 70% at 20% 100%,hsl(var(--h) 70% 45% / .7),transparent 60%),radial-gradient(80% 60% at 90% 10%,hsl(calc(var(--h) + 40) 60% 55% / .4),transparent 60%),linear-gradient(170deg,#0e1513,#1C2824)}
.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.bars i.on{background:#fff}
.stories .cap{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;text-wrap:balance}
.stories .tap{position:absolute;top:0;bottom:0;width:50%}
.stars{display:flex;gap:6px}
.stars button{color:var(--ink-2)}
.stars button[aria-pressed="true"]{color:var(--accent)}
.stars button[aria-pressed="true"] svg{fill:currentColor}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:700;font-size:12px;z-index:60;max-width:90%;text-align:center}
.toast[hidden]{display:none}
details.demo{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
details.demo summary{cursor:pointer;font-weight:700;font-size:12px;color:var(--ink-2)}
details.demo .chips{margin-top:10px}
.note{font-size:12px;color:var(--ink-2)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mini{flex:none;width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:16px;align-items:start}
.split,.tripgrid{display:flex;flex-direction:column;gap:16px}
.tcol,.narrow{display:flex;flex-direction:column;gap:16px;min-width:0}
.view>.narrow{max-width:720px}
@media (min-width:640px){
  .app{max-width:760px}
  .view{padding:20px 24px}
  .scrim{align-items:center;padding:16px}
  .sheet{max-width:600px;border-radius:20px;max-height:92%}
}
@media (min-width:900px){
  .app{max-width:1240px;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hdr hdr" "tabs view"}
  .hdr{grid-area:hdr;padding:14px 28px}
  .tabs{grid-area:tabs;display:flex;flex-direction:column;align-content:start;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line)}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:14px}
  .tabs button[aria-current="page"]{background:var(--accent-soft)}
  .tabs button[aria-current="page"]::before{display:none}
  .tabs .dot{top:50%;margin-top:-4px;left:auto;right:14px}
  .view{grid-area:view;padding:28px 36px;gap:20px}
  h1{font-size:38px}
  .split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);align-items:start}
  .split .hscroll{flex-direction:column;overflow:visible}
  .split .mini{width:auto}
  .tripgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);grid-template-areas:"map plan" "log plan";grid-template-rows:auto 1fr;align-items:start;gap:20px}
  .tmap{grid-area:map}.tplan{grid-area:plan}.tlog{grid-area:log}
  .toast{bottom:24px}
}
</style>

/* ---------- geometry: routes follow the road grid ---------- */
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
const man=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
function buildRoute(stops){
  const pts=[stops[0]],at=[0];let cum=0;
  for(let i=1;i<stops.length;i++){
    const a=pts[pts.length-1],b=stops[i];
    const mid=(i%2===1)?[b[0],a[1]]:[a[0],b[1]];
    [mid,b].forEach(p=>{const q=pts[pts.length-1];if(!same(p,q)){cum+=man(p,q);pts.push(p);}});
    at.push(cum);
  }
  return {pts,at,total:cum};
}
function posAt(pts,d){
  let r=d;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],l=man(a,b);
    if(r<=l||i===pts.length-1){const t=l?Math.min(r,l)/l:0;return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,dx:Math.sign(b[0]-a[0]),dy:Math.sign(b[1]-a[1])};}
    r-=l;
  }
  return {x:pts[0][0],y:pts[0][1],dx:0,dy:1};
}
const kmTxt=u=>(u*KM).toFixed(1)+' km';
const minTxt=u=>Math.max(1,Math.ceil(u*KM/KMH*60))+' min';
function boxFor(points,ratio,pad,minW){
  const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
  let w=Math.max(...xs)-Math.min(...xs)+2*pad,h=Math.max(...ys)-Math.min(...ys)+2*pad;
  w=Math.max(w,minW);h=Math.max(h,minW/ratio);
  if(w/h>ratio)h=w/ratio;else w=h*ratio;
  const cx=(Math.max(...xs)+Math.min(...xs))/2,cy=(Math.max(...ys)+Math.min(...ys))/2;
  return {x:cx-w/2,y:cy-h/2,w,h};
}

  let s='<rect class="m-land" x="-400" y="-400" width="1200" height="1200"/>';
  [[164,44,72,72],[44,204,72,32],[284,284,72,72],[44,404,72,32],[204,164,32,32]].forEach(p=>{s+=`<rect class="m-park" x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" rx="6"/>`;});

  s+='<path class="m-major" d="M-120 540L520 -100"/>';

  [['OLD TOWN',14,70],['HILLSIDE',330,170],['AIRPORT RIDGE',190,372],['MARINA',30,440],['SEASIDE',280,448],['THE GULF',150,530]].forEach(l=>{s+=`<text class="m-dist" x="${l[1]}" y="${l[2]}" font-size="9">${l[0]}</text>`;});

function mk(m,k){
  const [x,y]=m.pos,r=11*k,fs=10*k;let g='';
  const label=m.label?`<text class="m-text" x="${x}" y="${y+r+fs+2*k}" font-size="${fs}" text-anchor="middle">${esc(m.label)}</text>`:'';

  if(m.kind==='you')return `<circle class="pulse" cx="${x}" cy="${y}" r="${r}" style="fill:var(--me)"/><circle cx="${x}" cy="${y}" r="${r*.6}" style="fill:var(--me);stroke:var(--surface);stroke-width:${2*k}"/>${label}`;
  if(m.kind==='event')g=`<rect x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" rx="${r*.4}" style="fill:var(--ink)"/><path d="M${x-r*.4} ${y-r*.5}L${x+r*.5} ${y}L${x-r*.4} ${y+r*.5}Z" style="fill:var(--bg)"/>`;
  else if(m.kind==='home')g=`<circle cx="${x}" cy="${y}" r="${r}" style="fill:var(--good);stroke:var(--surface);stroke-width:${2*k}"/><path d="M${x-r*.5} ${y+r*.1}L${x} ${y-r*.5}L${x+r*.5} ${y+r*.1}V${y+r*.5}H${x-r*.5}Z" style="fill:var(--bg)"/>`;
  else g=`<circle cx="${x}" cy="${y}" r="${r}" style="fill:${m.kind==='park'?'var(--accent)':'var(--surface)'};stroke:var(--accent);stroke-width:${2.2*k}"/><text x="${x}" y="${y+fs*.36}" font-size="${fs*1.05}" text-anchor="middle" style="font-family:var(--f-body);font-weight:800;fill:${m.kind==='park'?'var(--accent-ink)':'var(--accent)'}">${esc(m.glyph||'')}</text>`;
  if(m.count)g+=`<circle cx="${x+r*.9}" cy="${y-r*.9}" r="${r*.62}" style="fill:var(--ink);stroke:var(--surface);stroke-width:${1.5*k}"/><text x="${x+r*.9}" y="${y-r*.9+fs*.34}" font-size="${fs*.9}" text-anchor="middle" style="font-family:var(--f-body);font-weight:800;fill:var(--bg)">${m.count}</text>`;
  g=m.hit?`<g class="hit" data-act="open" data-id="${m.hit}" role="button" tabindex="0" aria-label="${esc(m.aria||'Open plan')}">${g}</g>`:g;
  return g+label;
}
function mapSVG(o){
  const k=o.box.w/400;let s=BASE;
  if(o.trail&&o.trail.length>1)s+=`<polyline class="m-trail" points="${o.trail.map(p=>p.join(',')).join(' ')}"/>`;
  if(o.route){const pl=o.route.map(p=>p.join(',')).join(' ');s+=`<polyline class="m-route-bg" points="${pl}"/><polyline class="m-route" points="${pl}"/>`;}
  if(o.dev)s+=`<line class="m-dev" x1="${o.dev.from[0]}" y1="${o.dev.from[1]}" x2="${o.dev.to[0]}" y2="${o.dev.to[1]}"/>`;
  (o.markers||[]).forEach(m=>{s+=mk(m,k);});
  if(o.car){const c=o.car,ang=Math.atan2(c.dx,-c.dy)*180/Math.PI;
    s+=`<g transform="translate(${c.x} ${c.y})"><circle class="pulse" r="${12*k}" style="fill:${o.dev?'var(--bad)':'var(--accent)'}"/><g transform="rotate(${ang}) scale(${k})"><path d="M0 -12L8 9L0 5L-8 9Z" style="fill:${o.dev?'var(--bad)':'var(--accent)'};stroke:var(--surface);stroke-width:2;stroke-linejoin:round"/></g></g>`;}
  return `<svg class="map" viewBox="${o.box.x.toFixed(1)} ${o.box.y.toFixed(1)} ${o.box.w.toFixed(1)} ${o.box.h.toFixed(1)}" role="img" aria-label="${esc(o.aria||'Map')}">${s}</svg>`;
}

function viewMap(){
  const pts=[EVENTS.a.pos,EVENTS.b.pos,...VENUES.map(v=>v.pos),HOME];
  const box=boxFor(pts,wide()?1.5:0.9,66,300);
  const markers=[];
  markers.push({kind:'home',pos:HOME,label:'Your place'});
  Object.values(EVENTS).forEach(e=>markers.push({kind:'event',pos:e.pos,label:e.venue}));
  VENUES.forEach((v,i)=>markers.push({kind:'stop',pos:v.pos,glyph:'',label:v.n}));
  if(S.event!=='all')markers.push({kind:'you',pos:EVENTS[S.event].pos,label:''});
  ['a','b'].forEach(eid=>{
    const hs=hosts.filter(h=>h.event===eid);
    hs.forEach((h,i)=>{const a=-Math.PI/2+i*(2*Math.PI/hs.length)+0.6,r=hs.length===1?0:40;
      markers.push({kind:'park',glyph:'P',pos:[EVENTS[eid].pos[0]+Math.cos(a)*r+(eid==='a'?0:0),EVENTS[eid].pos[1]+Math.sin(a)*r],count:h.crew.length,hit:h.id,aria:`${h.name}, ${h.crew.length} in the car, ${h.parkM} metres away`});});
  });
  const order=['stop','event','home','you','park'];markers.sort((a,b)=>order.indexOf(a.kind)-order.indexOf(b.kind));
  return `<div class="hero"><span class="eyebrow">Live map</span><h2>Who is parked where</h2><p class="muted">Each amber pin is a host parked near the event. The number on the pin is how many people are in that car. Tap one to see the full plan.</p></div>
  <div class="split"><div class="map-wrap">${mapSVG({box,markers,aria:'Map of events, parked hosts and next stops'})}</div>
  <div class="hscroll">${hosts.map(h=>`<button class="mini" data-act="open" data-id="${h.id}"><span class="row" style="justify-content:flex-start"><b>${esc(h.name)}</b><span class="tag crew" style="padding:2px 8px">${ic('users',12)}${h.crew.length}</span></span><span class="muted">${esc(h.color)} ${esc(h.car)}</span><span class="note">${h.parkM} m from ${esc(EVENTS[h.event].venue)}</span></button>`).join('')}</div></div>
  <p class="note">Sample map with made-up places. Real hosts appear here once they post a plan.</p>`;
}

function reqCard(r){

function tripCar(){const t=S.trip;const p=posAt(t.route.pts,t.dist);const off=t.devOff;

/* ---------- trip engine ---------- */
let timer=null,last=0;
function startTrip(){
  const r=S.req,h=hostById(r.hostId),L=legsFor(h,r.draft.house);
  const stops=L.stops.map(s=>({...s,arrived:false,skipped:false,revealed:true}));
  S.trip={host:h,stops,route:L.route,dist:0,travelled:0,devOff:0,dev:false,devAlerted:false,ciDone:false,checkin:null,mult:1,homing:false,sos:false,done:false,
    people:h.crew.length+1+(r.draft.friendOn?1:0),trail:[stops[0].pos.slice()],log:[]};
  logT('Plan shared with '+(CONTACTS.filter(c=>S.settings.share[c.id]).map(c=>c.name).join(' and ')||'no contacts'));
  logT('Route locked. Any change alerts you.','good');
  logT('Pickup photo check passed by both sides','good');
  logT('Plate '+h.plate+' and '+S.trip.people+' people confirmed');
  if(r.draft.house&&h.house)logT('His address unlocked: '+h.house.area+' (shown to you only)');
  r.status='active';last=performance.now();
  clearInterval(timer);timer=setInterval(tick,100);
}
function tick(){
  const t=S.trip;if(!t||t.done){clearInterval(timer);return;}
  const now=performance.now(),dt=Math.min((now-last)/1000,0.5);last=now;
  const v=7*t.mult*dt;t.dist=Math.min(t.route.total,t.dist+v);t.travelled+=v;
  if(t.dev)t.devOff=Math.min(60,t.devOff+14*dt);else t.devOff=Math.max(0,t.devOff-30*dt);
  const c=tripCar();const lp=t.trail[t.trail.length-1];
  if(Math.abs(lp[0]-c.x)+Math.abs(lp[1]-c.y)>3)t.trail.push([c.x,c.y]);
  t.stops.forEach(s=>{if(!s.arrived&&!s.skipped&&t.dist>=s.at-0.5){s.arrived=true;if(s.kind!=='park'&&s.kind!=='home')logT('Arrived at '+s.name);if(s.kind==='home')logT('Dropped off at your place','good');}});
  if(!t.devAlerted&&t.dev&&t.devOff*KM>=S.settings.threshold){t.devAlerted=true;logT('Car is '+(t.devOff*KM).toFixed(1)+' km off route. Contacts alerted.','bad');openSheet('dev');}
  if(!t.ciDone&&S.settings.checkin&&t.dist/t.route.total>=0.4){startCheckin();}
  if(t.checkin&&!t.checkin.expired&&S.sheet==='checkin'){t.checkin.left-=dt;const e=$('#ciLeft');if(e)e.textContent=Math.max(0,Math.ceil(t.checkin.left));if(t.checkin.left<=0){t.checkin.expired=true;logT('No check-in reply. Contacts alerted.','bad');renderSheet();}}
  if(t.dist>=t.route.total&&!t.done){t.done=true;clearInterval(timer);S.rating=0;openSheet('done');renderTabs();}
  if(S.tab==='trip'&&S.role==='rider'){
    const m=$('#tripMap'),s=$('#tripStats'),p=$('#tripStops'),l=$('#tripLog');
    if(m)m.innerHTML=tripMapHTML();if(s)s.innerHTML=tripStatsHTML();if(p)p.innerHTML=tripStopsHTML();if(l)l.innerHTML=tripLogHTML();
  }
}
function startCheckin(){const t=S.trip;t.ciDone=true;t.checkin={left:10,expired:false};logT('Check-in sent: "You good?"');openSheet('checkin');}
function sendHome(){
  const t=S.trip;if(!t||t.homing)return;
  const c=tripCar(),p=c.base;
  const horizFirst=p.dx!==0||p.dy===0;
  const start=[Math.round(p.x*10)/10,Math.round(p.y*10)/10];
  const mid=horizFirst?[HOME[0],start[1]]:[start[0],HOME[1]];
  const pts=[start];[mid,HOME].forEach(q=>{if(!same(q,pts[pts.length-1]))pts.push(q);});
  const total=pts.reduce((a,q,i)=>i?a+man(q,pts[i-1]):0,0);
  t.stops.forEach(s=>{if(!s.arrived&&s.kind!=='home')s.skipped=true;});
  const home=t.stops.find(s=>s.kind==='home');home.at=total;
  t.route={pts,at:[0,total],total};t.dist=0;t.homing=true;t.dev=false;t.devAlerted=false;t.devOff=0;
  logT('You chose "Take me home". Route changed to go straight to your place.','good');
}
function endTrip(){clearInterval(timer);S.trip=null;S.req=null;S.sheet=null;S.tab='tonight';renderAll();}

/* ---------- events ---------- */
function act(a,el,ev){
  const v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case 'role':S.role=v;renderAll();break;
    case 'tab':S.tab=v;if(S.role==='host')S.role='rider';renderAll();break;
    case 'evt':S.event=v;renderView();break;
    case 'grp':S.group=Number(v);renderView();break;
    case 'open':S.draft=newDraft(id);openSheet('detail');break;
    case 'vlog':S.vlog={id,i:0};openSheet('vlog');break;
    case 'vnext':{const h=hostById(S.vlog.id);if(S.vlog.i<h.vlog.length-1){S.vlog.i++;renderSheet();}else{S.draft=newDraft(h.id);openSheet('detail');}break;}
    case 'vprev':if(S.vlog.i>0){S.vlog.i--;renderSheet();}break;
    case 'close':closeSheet();break;
    case 'ausend':authSend();break;
    case 'auout':authOut();break;
    case 'auedit':{const m=S.auth.profile;S.auth.form={first_name:m.first_name,age:String(m.age),gender:m.gender,vibes:(m.vibes||[]).slice()};S.auth.editing=true;S.auth.err='';renderView();break;}
    case 'pfcancel':S.auth.editing=false;S.auth.err='';S.auth.file=null;S.auth.preview='';renderView();break;
    case 'pfgender':S.auth.form.gender=v;renderView();break;
    case 'pfvibe':{const a=S.auth.form.vibes,i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);renderView();break;}
    case 'pfsave':saveProfile();break;
    case 'fb':S.fb.sent=false;S.fb.err='';openSheet('fb');break;
    case 'fbset':S.fb[el.dataset.k]=v;renderSheet();break;
    case 'fbsend':{const f=S.fb;
      if(!f.safe.trim()&&!f.notes.trim()&&!f.contact.trim()){f.err='Write a line of feedback or leave your contact first.';renderSheet();break;}
      f.busy=true;f.err='';renderSheet();
      const body=new URLSearchParams({'form-name':'waitlist',role:f.role,use:f.use,name:f.name,contact:f.contact,city:f.city,safe:f.safe,notes:f.notes}).toString();
      fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body})
        .then(r=>{if(!r.ok)throw new Error('bad');f.sent=true;f.busy=false;if(S.sheet==='fb')renderSheet();})
        .catch(()=>{f.busy=false;f.err='Could not send. Check your connection and try again.';if(S.sheet==='fb')renderSheet();});
      break;}
    case 'scrim':if(el===ev.target&&!['dev','checkin','sos'].includes(S.sheet))closeSheet();break;
    case 'dhouse':S.draft.house=!S.draft.house;renderSheet();break;
    case 'dfon':S.draft.friendOn=!S.draft.friendOn;renderSheet();break;
    case 'dfg':S.draft.friend.gender=v;renderSheet();break;
    case 'dfsend':{const f=S.draft.friend;if(!f.name.trim()){toast('Add her first name first');break;}f.sent=true;renderSheet();
      setTimeout(()=>{f.verified=true;if(S.sheet==='detail')renderSheet();toast(f.name+' passed the selfie check (demo)');},1800);break;}
    case 'tglc':S.settings.share[id]=!S.settings.share[id];S.sheet==='detail'?renderSheet():renderView();break;
    case 'request':S.req={hostId:S.draft.id,status:'pending',draft:JSON.parse(JSON.stringify(S.draft))};closeSheet();S.tab='trip';renderAll();
      setTimeout(()=>{if(S.req&&S.req.status==='pending'){S.req.status='accepted';toast(hostById(S.req.hostId).name+' accepted. Your turn to confirm.');renderView();renderTabs();}},3000);break;
    case 'cancelreq':S.req=null;renderAll();break;
    case 'confirm':S.req.status='pickup';S.req.hostChecked=false;renderAll();
      setTimeout(()=>{if(S.req&&S.req.status==='pickup'){S.req.hostChecked=true;renderView();}},2000);break;
    case 'matchok':startTrip();renderAll();break;
    case 'nomatch':S.req=null;toast('Cancelled with no penalty. Reported for review (simulated).');renderAll();break;
    case 'mevibe':{const a=S.me.vibes,i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);renderView();break;}
    case 'seatplus':S.hostDraft.seats=Math.min(6,S.hostDraft.seats+1);renderView();break;
    case 'seatminus':S.hostDraft.seats=Math.max(1,S.hostDraft.seats-1);renderView();break;
    case 'hfr':S.hostDraft.friendsOk=!S.hostDraft.friendsOk;renderView();break;
    case 'hfp':S.hostDraft.friendPref=v;renderView();break;
    case 'hrule':{const a=S.hostDraft.rules,i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);renderView();break;}
    case 'racc':{const r=S.requests.find(x=>x.id===id);r.status='accepted';toast(r.name+' accepted. She confirms at pickup.');renderView();break;}
    case 'rdec':{const r=S.requests.find(x=>x.id===id);r.status='declined';renderView();break;}
    case 'sos':if(S.trip){S.trip.sos=true;logT('SOS sent to contacts and the safety team (simulated)','bad');}openSheet('sos');break;
    case 'soscancel':if(S.trip){S.trip.sos=false;S.trip.dev=false;logT('SOS cancelled by you','good');last=performance.now();}closeSheet();renderView();break;
    case 'home':sendHome();closeSheet();renderView();break;
    case 'devok':S.trip.dev=false;S.trip.devAlerted=false;logT('You confirmed all good. Car is back on route.','good');closeSheet();break;
    case 'ciok':S.trip.checkin=null;logT('You replied "I\'m good"','good');closeSheet();break;
    case 'simdev':if(S.trip&&!S.trip.done){S.trip.dev=true;toast('The car is drifting off the route');}break;
    case 'simci':if(S.trip&&!S.trip.done){startCheckin();}break;
    case 'speed':if(S.trip){S.trip.mult=Number(v);renderView();}break;
    case 'finish':endTrip();break;
    case 'star':S.rating=Number(v);renderSheet();break;
    case 'report':toast('Report started. A reviewer follows up (simulated).');break;
    case 'thr':S.settings.threshold=Number(v);renderView();break;
    case 'tglchk':S.settings.checkin=!S.settings.checkin;renderView();break;
    case 'fplus':S.hostDraft.friends.push({n:'',g:'Man',a:'27'});S.hostDraft.friends=S.hostDraft.friends.slice(0,7);renderView();break;
    case 'fminus':S.hostDraft.friends.pop();renderView();break;
    case 'hhouse':S.hostDraft.house=!S.hostDraft.house;renderView();break;
    case 'hvibe':{const a=S.hostDraft.vibe;const i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);renderView();break;}
    case 'publish':publish();break;
    case 'seerider':S.role='rider';S.tab='tonight';S.event=S.posted.event;renderAll();break;
    case 'editplan':S.posted=null;renderView();break;
  }
}
function publish(){
  const d=S.hostDraft;
  if(!d.name.trim()){toast('Add your name first');$('#f-name')&&$('#f-name').focus();return;}
  if(!d.verified){toast('Confirm that everyone in the car passed the selfie check');return;}
  const venue=VENUES[d.v],nm=d.name.trim();
  const h={id:'me',name:nm,rating:0,trips:0,car:d.car,color:d.color,plate:d.plate.toUpperCase(),event:d.event,parkDesc:d.park,parkM:100,
    crew:[[nm,'Driver',d.gender,Number(d.age)||27],...d.friends.map((f,i)=>[f.n.trim()||'Friend '+(i+1),'Friend',f.g,Number(f.a)||27])],
    seats:d.seats,friendsOk:d.friendsOk,friendPref:d.friendPref,rules:d.rules.length?d.rules.slice():['Sober driver'],
    v:d.v,house:d.house?{area:'Your area',pos:HOUSES[4]}:null,
    vibe:d.vibe.length?d.vibe.slice():['Chill'],leaving:d.leaving.replace(/^0/,'')+' AM',vlog:['Tonight with '+nm,venue.n+' next','Everyone gets home safe'],verified:true};
  const ix=hosts.findIndex(x=>x.id==='me');if(ix>-1)hosts.splice(ix,1);
  hosts.unshift(h);S.posted=h;renderView();toast('Your plan is live');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  act(el.dataset.act,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet&&!['dev','checkin','sos'].includes(S.sheet))closeSheet();
  if(e.key==='Enter'){const g=e.target.closest&&e.target.closest('g[data-act]');if(g)act(g.dataset.act,g,e);}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.fr!==undefined){S.hostDraft.friends[Number(el.dataset.fr)][el.dataset.k]=el.value;return;}
  if(el.dataset.df){S.draft.friend[el.dataset.df]=el.value;return;}
  if(el.dataset.fb){S.fb[el.dataset.fb]=el.value;return;}
  if(el.dataset.au==='email'){S.auth.email=el.value;return;}
  if(el.dataset.pf){S.auth.form[el.dataset.pf]=el.value;return;}
  if(el.dataset.auFile){const f=el.files&&el.files[0];if(f){S.auth.file=f;S.auth.preview=URL.createObjectURL(f);renderView();}return;}
  const f=el.dataset.f;if(!f)return;
  if(f==='verified')S.hostDraft.verified=el.checked;
  else if(f==='vlogFile'){S.hostDraft.vlogName=el.files&&el.files[0]?el.files[0].name:'';renderView();}
  else if(f==='v')S.hostDraft.v=Number(el.value);
  else S.hostDraft[f]=el.value;
});
async function authSend(){
  const A=S.auth,email=A.email.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){A.err='Enter a valid email address.';renderView();return;}
  A.status='sending';A.err='';renderView();
  const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){A.status='idle';A.err=error.message||'Could not send the link. Try again in a minute.';}else A.status='sent';
  renderView();
}
async function authOut(){
  await SB.auth.signOut();
  const A=S.auth;A.user=null;A.profile=null;A.editing=false;A.status='idle';A.file=null;A.preview='';A.err='';
  A.form={first_name:'',age:'',gender:'Woman',vibes:[]};S.me={...DEMO_ME,vibes:DEMO_ME.vibes.slice()};renderAll();
}
async function loadProfile(){
  const A=S.auth;if(!A.user)return;
  const {data,error}=await SB.from('profiles').select('*').eq('id',A.user.id).maybeSingle();
  if(error){A.err='Could not load your profile. '+(error.message||'');renderAll();return;}
  A.profile=data;
  if(data){
    let url='';
    if(data.photo_path){const r=await SB.storage.from('avatars').createSignedUrl(data.photo_path,3600);url=(r&&r.data&&r.data.signedUrl)||'';}
    S.me={name:data.first_name,age:data.age,gender:data.gender,vibes:data.vibes||[],photo:url,real:true,shows:null};
    A.form={first_name:data.first_name,age:String(data.age),gender:data.gender,vibes:(data.vibes||[]).slice()};
    A.editing=false;
  }else{A.editing=true;S.tab='safety';S.role='rider';}
  renderAll();
}
async function saveProfile(){
  const A=S.auth,f=A.form,age=parseInt(f.age,10);
  const hasPhoto=!!(A.file||(A.profile&&A.profile.photo_path));
  if(!f.first_name.trim()){A.err='Add your first name.';renderView();return;}
  if(!(age>=18&&age<=99)){A.err='You must be 18 or older to use Pull Up.';renderView();return;}
  if(!hasPhoto){A.err='Add a clear photo of your face.';renderView();return;}
  A.saving=true;A.err='';renderView();
  try{
    let path=A.profile&&A.profile.photo_path||null;
    if(A.file){
      if(!/^image\//.test(A.file.type))throw new Error('Pick an image file.');
      if(A.file.size>3*1024*1024)throw new Error('That photo is over 3 MB. Pick a smaller one.');
      path=A.user.id+'/avatar';
      const up=await SB.storage.from('avatars').upload(path,A.file,{upsert:true,contentType:A.file.type});
      if(up.error)throw up.error;
    }
    const {error}=await SB.from('profiles').upsert({id:A.user.id,first_name:f.first_name.trim(),age,gender:f.gender,vibes:f.vibes,photo_path:path,updated_at:new Date().toISOString()});
    if(error)throw error;
    A.file=null;A.preview='';
    A.saving=false;await loadProfile();toast('Profile saved');return;
  }catch(e){A.err=(e&&e.message)||'Could not save. Try again.';}
  A.saving=false;renderView();
}
if(SB){
  SB.auth.getSession().then(r=>{const u=r&&r.data&&r.data.session&&r.data.session.user;if(u&&!S.auth.user){S.auth.user=u;loadProfile();}});
  SB.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null;
    if(u&&(!S.auth.user||S.auth.user.id!==u.id)){S.auth.user=u;loadProfile();}
  });
}
renderAll();
const mq=window.matchMedia('(min-width:900px)');
if(mq.addEventListener)mq.addEventListener('change',()=>renderAll());
})();
</script>
</body></html>
