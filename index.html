    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B110F; --surface:#121A17; --surface-2:#1A2420; --ink:#EBF0EA; --ink-2:#98A79F; --line:#26332D;
  --accent:#EDB44E; --accent-ink:#1B1204; --accent-soft:#2B2311;

html,body{height:100%}

function reqCard(r){
  const d=S.hostDraft,left=seatsLeft(),need=1+(r.friend?1:0);

  let why='';
  if(r.status==='new'){
    if(r.friend&&!d.friendsOk)why='Your plan does not allow extra friends.';
    else if(r.friend&&d.friendPref==='women'&&r.friend.gender==='Man')why='Your plan is open to women friends only.';
    else if(need>left)why='Needs '+need+' seat'+(need>1?'s':'')+', you have '+left+'.';
  }
  return `<div class="req"><div class="crewline">${av(r.name,52,true)}${r.friend?av(r.friend.name,52,true):''}<div style="flex:1;min-width:0"><b>${esc(r.name)}, ${r.age}</b><div class="note">Woman · Face matched · ${r.shows}% show-up · ${r.rating.toFixed(1)} from hosts</div></div></div>

  ${r.status==='accepted'?`<span class="vbadge" style="align-self:flex-start">${ic('check',11)}Accepted. She confirms at pickup.</span>`:`${why?`<p class="note" style="color:var(--bad)">${why}</p>`:''}<div class="two"><button class="btn sm" style="width:100%" data-act="racc" data-id="${r.id}" ${why?'disabled':''}>Accept</button><button class="btn ghost sm" style="width:100%" data-act="rdec" data-id="${r.id}">Decline</button></div>`}</div>`;

function tripCar(){const t=S.trip;const p=posAt(t.route.pts,t.dist);const off=t.devOff;
  return {x:p.x+(-p.dy)*off,y:p.y+(p.dx)*off,dx:p.dx,dy:p.dy,base:p};}
function tripMapHTML(){
  const t=S.trip,c=tripCar();
  const pts=[...t.route.pts,...t.trail.slice(-2)];
  const box=boxFor(pts,wide()?1.5:1.25,50,230);
  const markers=[];
  t.stops.forEach((s,i)=>{if(s.skipped)return;
    if(s.kind==='home')markers.push({kind:'home',pos:s.pos,label:'Your place'});
    else if(s.kind==='house'&&!s.revealed)markers.push({kind:'fuzz',pos:s.pos,label:'His place'});
    else markers.push({kind:s.kind==='park'?'park':'stop',glyph:s.kind==='park'?'P':String(i),pos:s.pos,label:s.name});});
  return mapSVG({box,route:t.route.pts,trail:t.trail,markers,car:c,dev:t.devOff>1?{from:[c.base.x,c.base.y],to:[c.x,c.y]}:null,aria:'Live trip map with planned route and car position'});
}
function nextStop(t){return t.stops.find(s=>!s.arrived&&!s.skipped);}
function tripStatsHTML(){
  const t=S.trip,rem=Math.max(0,t.route.total-t.dist),n=nextStop(t);
  const toNext=n?Math.max(0,n.at-t.dist):0;
  return `<div class="stat"><b>${kmTxt(toNext)}</b><span>to ${n?esc(n.name):'the end'}</span></div><div class="stat"><b>${kmTxt(rem)}</b><span>to drop-off</span></div><div class="stat"><b>${minTxt(rem)}</b><span>arrive home</span></div>`;
}
function tripStopsHTML(){
  const t=S.trip;
  return t.stops.map((s,i)=>`<li class="stop ${s.arrived?'done':''} ${s.skipped?'skip':''}"><span class="n">${s.arrived?ic('check',14):i+1}</span><span><b>${esc(s.name)}</b><small>${s.kind==='house'&&!s.revealed?esc(s.sub):esc(s.sub)}</small></span><span class="note">${s.skipped?'Skipped':s.arrived?'Done':''}</span></li>`).join('');
}
function tripLogHTML(){return S.trip.log.slice().reverse().map(l=>`<li class="${l.k||''}"><b>${l.t}</b><span>${esc(l.m)}</span></li>`).join('');}
function clock(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function logT(m,k){S.trip.log.push({t:clock(),m,k});}

function paintChat(){
  const el=document.getElementById('chatList');if(!el||!S.chat)return;
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<60;

async function pollChat(){
  const c=S.chat;if(!c||S.sheet!=='chat'||c.busy)return;
  c.busy=true;
  try{
    const r=await SB.from('messages').select('id,sender_id,body,created_at').eq('request_id',c.id).order('created_at',{ascending:true}).limit(200);
    if(r.error){c.err=/relation|messages/i.test(r.error.message||'')?'Chat needs the step 8 database update.':'Could not load messages.';const e=document.getElementById('chatErr');if(e)e.textContent=c.err;}
    else if(S.chat===c){const pend=c.msgs.filter(m=>m.pending);c.msgs=[...(r.data||[]),...pend.filter(p=>!(r.data||[]).some(d=>d.body===p.body&&d.sender_id===p.sender_id&&Math.abs(new Date(d.created_at)-new Date(p.created_at))<60000))];paintChat();}
  }catch(e){}
  c.busy=false;
}
function openChat(reqId,name){
  S.chat={id:reqId,name:name||'Match',msgs:[],err:'',first:true,busy:false};
  openSheet('chat');
  pollChat();
  S.chatTimer=setInterval(pollChat,4000);
}
async function sendChat(){
  const c=S.chat,inp=document.getElementById('chatIn');if(!c||!inp||!S.auth.user)return;
  const body=inp.value.trim().slice(0,500);if(!body)return;
  inp.value='';
  const m={id:'tmp'+Date.now(),sender_id:S.auth.user.id,body,created_at:new Date().toISOString(),pending:true};
  c.msgs.push(m);paintChat();
  const r=await SB.from('messages').insert({request_id:c.id,sender_id:S.auth.user.id,body});
  if(r&&r.error){c.msgs=c.msgs.filter(x=>x!==m);paintChat();inp.value=body;toast(/policy|row-level/i.test(r.error.message||'')?'Chat is closed for this ride.':'Message not sent. Try again.');}
  else{m.pending=false;pollChat();}
}

async function sendRealRequest(){
  const h=hostById(S.draft.id),D=S.draft,F=D.friend,A=S.auth;
  if(!h||!h.real||!A.user||S.sendingReq)return;
  S.sendingReq=true;
  try{
    const friend=D.friendOn?{n:F.name.trim().slice(0,40),g:F.gender,a:Number(F.age)||27}:null;
    const r=await SB.from('requests').upsert({plan_id:h.planId,rider_id:A.user.id,friend,status:'pending'},{onConflict:'plan_id,rider_id'}).select('id,status').single();
    if(r.error)throw r.error;
    S.myReqs[h.planId]={id:r.data.id,status:'pending',plate:null};
    toast('Request sent to '+h.name);
    renderSheet();renderView();
  }catch(e){toast('Could not send: '+(((e&&e.message)||'try again').slice(0,80)));}
  S.sendingReq=false;
}
async function cancelRealRequest(hid){
  const h=hostById(hid),q=h&&S.myReqs[h.planId];if(!q)return;
  const r=await SB.from('requests').update({status:'cancelled'}).eq('id',q.id);
  if(r&&r.error){toast('Could not cancel. Try again.');return;}
  q.status='cancelled';toast('Request cancelled');renderSheet();renderView();
}
async function decideRequest(id,status){
  const r=S.hostReqs.find(x=>x.id===id);if(!r)return;
  if(status==='accepted'&&(r.status!=='pending'))return;
  const res=await SB.from('requests').update({status}).eq('id',id);
  if(res&&res.error){toast('Could not update. Try again.');return;}
  r.status=status;toast(status==='accepted'?r.name+' accepted':'Declined');renderView();
}
async function loadRequests(rows,mine){
  const A=S.auth;if(!SB||!A.user)return false;
  let changed=false;
  try{
    const mr=await SB.from('requests').select('id,plan_id,status').eq('rider_id',A.user.id);
    if(mr.error){S.reqOff=true;return false;}
    S.reqOff=false;
    const next={};
    for(const x of (mr.data||[])){
      const prev=S.myReqs[x.plan_id];
      const o={id:x.id,status:x.status,plate:prev&&prev.plate||null};
      if(x.status==='accepted'&&!o.plate){const pp=await SB.from('plan_private').select('plate').eq('plan_id',x.plan_id).maybeSingle();o.plate=(pp&&pp.data&&pp.data.plate)||null;}
      if(!prev||prev.status!==x.status){changed=true;const h=S.live.find(z=>z.planId===x.plan_id);if(prev&&h){if(x.status==='accepted')toast(h.name+' accepted your request');else if(x.status==='declined')toast(h.name+' passed on your request');}}
      if(o.plate){const h=S.live.find(z=>z.planId===x.plan_id);if(h)h.plate=o.plate;}
      next[x.plan_id]=o;
    }
    S.myReqs=next;
    if(mine){
      const q=cols=>SB.from('requests').select('*, rider:profiles!requests_rider_id_fkey('+cols+')').eq('plan_id',mine.planId).neq('status','cancelled').order('created_at',{ascending:true});
      let hr=await q('first_name,age,gender,vibes,photo_path,instagram');
      if(hr.error&&/instagram/i.test(hr.error.message||''))hr=await q('first_name,age,gender,vibes,photo_path');
      const list=(hr&&hr.data)||[];
      const paths=[...new Set(list.map(x=>x.rider&&x.rider.photo_path).filter(Boolean))],urls={};
      if(paths.length){const u=await SB.storage.from('avatars').createSignedUrls(paths,3600);((u&&u.data)||[]).forEach(z=>{if(z.signedUrl&&z.path)urls[z.path]=z.signedUrl;});}
      const before=S.hostReqs.length;
      S.hostReqs=list.filter(x=>x.rider).map(x=>({id:x.id,status:x.status,name:x.rider.first_name,age:x.rider.age,gender:x.rider.gender,vibes:x.rider.vibes||[],photo:urls[x.rider.photo_path]||null,ig:x.rider.instagram||null,rid:x.rider_id,friend:x.friend}));
      if(S.hostReqs.length>before)changed=true;
    }else S.hostReqs=[];
  }catch(e){S.reqOff=true;}
  return changed;
}

async function loadSocial(rows){
  const A=S.auth;if(!SB||!A.user)return;
  try{
    const f=await SB.from('follows').select('followed_id').eq('follower_id',A.user.id);

    S.socialOff=false;S.fol=new Set((f.data||[]).map(x=>x.followed_id));await loadFriends();
    const ids=[...new Set(rows.map(p=>p.host_id))];
    if(ids.length){const c=await SB.rpc('follower_counts',{host_ids:ids});S.fcounts={};((c&&c.data)||[]).forEach(x=>{S.fcounts[x.host_id]=Number(x.n);});}
    const g=await SB.rpc('going_counts');S.gcounts={};((g&&g.data)||[]).forEach(x=>{S.gcounts[x.event]=Number(x.n);});
    const me=await SB.from('going').select('event').eq('user_id',A.user.id).gt('expires_at',new Date().toISOString());
    S.goingMe=new Set(((me&&me.data)||[]).map(x=>x.event));
  }catch(e){S.socialOff=true;}
}
async function toggleFollowUid(uid,name){
  const A=S.auth;if(!uid||!A.user){toast('Sign in to follow people');S.tab='profile';renderAll();return;}
  const on=S.fol.has(uid);
  if(on){S.fol.delete(uid);S.friends.delete(uid);S.fcounts[uid]=Math.max(0,(S.fcounts[uid]||1)-1);}else{S.fol.add(uid);S.fcounts[uid]=(S.fcounts[uid]||0)+1;}
  renderAll();
  const r=on?await SB.from('follows').delete().eq('follower_id',A.user.id).eq('followed_id',uid):await SB.from('follows').insert({follower_id:A.user.id,followed_id:uid});
  if(r&&r.error){if(on){S.fol.add(uid);S.fcounts[uid]=(S.fcounts[uid]||0)+1;}else{S.fol.delete(uid);S.fcounts[uid]=Math.max(0,(S.fcounts[uid]||1)-1);}renderAll();toast('Could not update. Try again.');return;}
  await loadFriends();
  toast(on?'Unfollowed '+name:(S.friends.has(uid)?'You and '+name+' are friends':'Following '+name));
  renderAll();
}
const toggleFollow=h=>toggleFollowUid(h.hostUid,h.name);

async function shrinkImage(file,max){
  try{
    const url=URL.createObjectURL(file),img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));return b||file;
  }catch(e){return file;}
}

let timer=null,last=0;
function startTrip(){
  const r=S.req,h=hostById(r.hostId),L=legsFor(h,r.draft.house);
  const stops=L.stops.map(s=>({...s,arrived:false,skipped:false,revealed:true}));
  S.trip={host:h,stops,route:L.route,dist:0,travelled:0,devOff:0,dev:false,devAlerted:false,ciDone:false,checkin:null,mult:1,homing:false,sos:false,done:false,
    people:h.crew.length+1+(r.draft.friendOn?1:0),trail:[stops[0].pos.slice()],log:[]};
  logT('Plan shared with '+(CONTACTS.filter(c=>S.settings.share[c.id]!==false).map(c=>c.name).join(' and ')||'no contacts'));
  logT('Route locked. Any change alerts you.','good');
  logT('Pickup photo check passed by both sides','good');
  logT('Plate '+h.plate+' and '+S.trip.people+' people confirmed');
  if(r.draft.house&&h.house)logT('His address unlocked: '+h.house.area+' (shown to you only)');
  r.status='active';last=performance.now();

function tick(){
  const t=S.trip;if(!t||t.done){clearInterval(timer);return;}
  const now=performance.now(),dt=Math.min((now-last)/1000,0.5);last=now;
  const v=7*t.mult*dt;t.dist=Math.min(t.route.total,t.dist+v);t.travelled+=v;
  if(t.dev)t.devOff=Math.min(60,t.devOff+14*dt);else t.devOff=Math.max(0,t.devOff-30*dt);
  const c=tripCar();const lp=t.trail[t.trail.length-1];
  if(Math.abs(lp[0]-c.x)+Math.abs(lp[1]-c.y)>3)t.trail.push([c.x,c.y]);
  t.stops.forEach(s=>{if(!s.arrived&&!s.skipped&&t.dist>=s.at-0.5){s.arrived=true;if(s.kind!=='park'&&s.kind!=='home')logT('Arrived at '+s.name);if(s.kind==='home')logT('Dropped off at your place','good');}});
  if(!t.devAlerted&&t.dev&&t.devOff*KM>=S.settings.threshold){t.devAlerted=true;sosLocate();logT('Car is '+(t.devOff*KM).toFixed(1)+' km off route. Contacts alerted.','bad');openSheet('dev');}
  if(!t.ciDone&&S.settings.checkin&&t.dist/t.route.total>=0.4){startCheckin();}
  if(t.checkin&&!t.checkin.expired&&S.sheet==='checkin'){t.checkin.left-=dt;const e=$('#ciLeft');if(e)e.textContent=Math.max(0,Math.ceil(t.checkin.left));if(t.checkin.left<=0){t.checkin.expired=true;logT('No check-in reply. Contacts alerted.','bad');renderSheet();}}
  if(t.dist>=t.route.total&&!t.done){t.done=true;clearInterval(timer);S.rating=0;openSheet('done');renderTabs();}
  if(S.tab==='trip'&&S.role==='rider'){
    const m=$('#tripMap'),s=$('#tripStats'),p=$('#tripStops'),l=$('#tripLog');
    if(m)m.innerHTML=tripMapHTML();if(s)s.innerHTML=tripStatsHTML();if(p)p.innerHTML=tripStopsHTML();if(l)l.innerHTML=tripLogHTML();
  }
}

function sendHome(){
  const t=S.trip;if(!t||t.homing)return;
  const c=tripCar(),p=c.base;
  const horizFirst=p.dx!==0||p.dy===0;
  const start=[Math.round(p.x*10)/10,Math.round(p.y*10)/10];
  const mid=horizFirst?[HOME[0],start[1]]:[start[0],HOME[1]];
  const pts=[start];[mid,HOME].forEach(q=>{if(!same(q,pts[pts.length-1]))pts.push(q);});
  const total=pts.reduce((a,q,i)=>i?a+man(q,pts[i-1]):0,0);
  t.stops.forEach(s=>{if(!s.arrived&&s.kind!=='home')s.skipped=true;});
  const home=t.stops.find(s=>s.kind==='home');home.at=total;
  t.route={pts,at:[0,total],total};t.dist=0;t.homing=true;t.dev=false;t.devAlerted=false;t.devOff=0;
  logT('You chose "Take me home". Route changed to go straight to your place.','good');
}

    await loadEvents();
    const q=cols=>SB.from('plans').select('*, host:profiles!plans_host_id_fkey('+cols+')').eq('active',true).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(60);
    let r=await q('first_name,age,gender,photo_path,instagram,car_photo_path,car,car_color');
    if(r.error&&/car_photo_path|car_color|\bcar\b/i.test(r.error.message||''))r=await q('first_name,age,gender,photo_path,instagram');
    if(r.error&&/instagram/i.test(r.error.message||''))r=await q('first_name,age,gender,photo_path');
    if(r.error){S.liveErr=r.error.message||'error';S.live=[];}
    else{
      S.liveErr='';
      const rows=(r.data||[]).filter(p=>p.host);
      const paths=[...new Set(rows.map(p=>p.host.photo_path).filter(Boolean))];
      const urls={};
      if(paths.length){const u=await SB.storage.from('avatars').createSignedUrls(paths,3600);((u&&u.data)||[]).forEach(x=>{if(x.signedUrl&&x.path)urls[x.path]=x.signedUrl;});}
      const hids=[...new Set(rows.map(p=>p.host_id))];let pr={};
      try{const pq=await SB.from('posts').select('*').in('host_id',hids).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:true});if(pq&&!pq.error)(pq.data||[]).forEach(x=>{(pr[x.host_id]=pr[x.host_id]||[]).push(x);});}catch(e){}
      const vurls=await signVlogs([...rows.map(p=>p.vlog_path),...rows.map(p=>p.host.car_photo_path),...Object.values(pr).flat().map(x=>x.path)].filter(Boolean));
      S.live=rows.map(p=>{const h=planToHost(p,urls[p.host.photo_path]);
        h.posts=(pr[p.host_id]||[]).filter(x=>vurls[x.path]).map(x=>({id:x.id,kind:x.kind,url:vurls[x.path],caption:x.caption||'',expires:x.expires_at,created:x.created_at}));
        if(!h.posts.length&&p.vlog_path&&vurls[p.vlog_path])h.posts=[{id:'legacy',kind:'video',url:vurls[p.vlog_path],caption:'',expires:p.expires_at}];
        h.carUrl=p.host.car_photo_path?(vurls[p.host.car_photo_path]||null):null;
        const f=h.posts[0];h.vlogThumb=f?f.url:null;h.thumbKind=f?f.kind:'video';return h;});
      await loadSocial(rows);
      const mine=S.live.find(h=>h.mine);
      if(mine){
        const pr=await SB.from('plan_private').select('plate').eq('plan_id',mine.planId).maybeSingle();
        mine.plate=(pr&&pr.data&&pr.data.plate)||null;
        S.posted=mine;
      }else if(S.posted&&S.posted.real){S.posted=null;}
      reqChanged=await loadRequests(rows,mine||null);
    }
  }catch(e){S.liveErr=(e&&e.message)||'error';}
  liveBusy=false;
  if(S.sheet==='detail'&&reqChanged)renderSheet();
  if(!S.sheet&&((S.role==='rider'&&(S.tab==='tonight'||S.tab==='map'))||(S.role==='host'&&(S.tab==='home'||S.tab==='map'))))renderView();
}
function readVideoMeta(file){
  return new Promise(res=>{
    const v=document.createElement('video'),u=URL.createObjectURL(file);let done=false;
    const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);res(r);};
    v.preload='metadata';v.muted=true;
    v.onloadedmetadata=()=>fin({ok:true,duration:v.duration});
    v.onerror=()=>fin({ok:false});
    setTimeout(()=>fin({ok:false}),6000);
    v.src=u;
  });
}
async function pickVlog(file){
  const d=S.hostDraft;d.vlogErr='';d.vlogWarn='';
  if(d.vlogPreview){try{URL.revokeObjectURL(d.vlogPreview);}catch(e){}}
  d.vlogFile=null;d.vlogName='';d.vlogPreview='';
  if(!file){renderView();return;}
  if(!/^video\//.test(file.type||'')){d.vlogErr='Pick a video file.';renderView();return;}
  if(file.size>45*1024*1024){d.vlogErr='That video is over 45 MB. Record a shorter clip or at a lower quality.';renderView();return;}
  const m=await readVideoMeta(file);
  if(m.ok&&m.duration>62){d.vlogErr='That clip is '+Math.round(m.duration)+' seconds. Keep it under 60.';renderView();return;}
  if(!m.ok)d.vlogWarn='This video could not be read here. It may not play on every phone. MP4 works best.';
  d.vlogFile=file;d.vlogName=file.name;d.vlogPreview=URL.createObjectURL(file);
  renderView();
}
async function publishReal(){
  const d=S.hostDraft,A=S.auth;
  if(!A.user||!A.profile){toast('Sign in and create your profile first');S.tab='profile';renderAll();return;}
  if(!carOk()){toast('Add your car, its colour and a photo in Profile first');S.tab='profile';renderAll();return;}
  if(!d.plate.trim()){toast('Add your plate number');return;}
  if(!d.verified){toast('Confirm that everyone in the car passed the selfie check');return;}
  if(S.publishing)return;
  S.publishing=true;renderView();
  try{
    const row={host_id:A.user.id,event:d.event,park_desc:d.park.trim().slice(0,120)||'Near the main gate',park_m:100,leaving_text:fmtTime(d.leaving),car:(A.profile.car||d.car).trim().slice(0,60),color:(A.profile.car_color||d.color).trim().slice(0,30),
      next_venue:d.v,house_offered:d.house,house_area:'Nearby',house_idx:Math.floor(Math.random()*HOUSES.length),seats:d.seats,friends_ok:d.friendsOk,friend_pref:d.friendPref,
      rules:d.rules.length?d.rules.slice():['Sober driver'],vibe:d.vibe.length?d.vibe.slice():['Chill'],
      crew:d.friends.map(f=>({n:(f.n||'Friend').trim().slice(0,40),g:f.g,a:Number(f.a)||27})),active:true};
    if(d.pickLL){row.pickup_lat=d.pickLL[0];row.pickup_lng=d.pickLL[1];}
    const okStops=d.stops.filter(x=>x.ll).slice(0,3);
    if(okStops.length){row.stop_name=(okStops[0].name||'Next stop').slice(0,80);row.stop_lat=okStops[0].ll[0];row.stop_lng=okStops[0].ll[1];row.stops=okStops.map(x=>({name:(x.name||'Stop').slice(0,80),ll:x.ll}));}
    if(EVENTS[d.event]&&EVENTS[d.event].row)await evSaveRow(EVENTS[d.event].row);
    row.vlog_path=null;
    const off=await SB.from('plans').update({active:false}).eq('host_id',A.user.id).eq('active',true);
    if(off.error)throw off.error;
    let ins=await SB.from('plans').insert(row).select('id').single();
    if(ins.error&&/pickup_|stop_|stops/.test(ins.error.message||'')){
      ['pickup_lat','pickup_lng','stop_name','stop_lat','stop_lng','stops'].forEach(k=>delete row[k]);
      ins=await SB.from('plans').insert(row).select('id').single();
      if(!ins.error)toast('Posted without your pins. Run supabase-step14-stops.sql (and step 11) to save real places.');
    }
    if(ins.error)throw ins.error;
    const pr=await SB.from('plan_private').insert({plan_id:ins.data.id,plate:d.plate.trim().toUpperCase().slice(0,20)});
    if(pr.error)throw pr.error;
    await loadLive();
    S.tab='home';
    toast('Your plan is live');
  }catch(e){toast('Could not post: '+((e&&e.message)||'try again').slice(0,90));}
  S.publishing=false;renderAll();
}
async function endPlan(){
  const h=S.posted;if(!h||!h.real)return;
  const r=await SB.from('plans').update({active:false}).eq('id',h.planId);
  if(r.error){toast('Could not end it: '+(r.error.message||'try again'));return;}
  if(h.vlogPath){SB.storage.from('vlogs').remove([h.vlogPath]).catch(()=>{});}
  S.posted=null;S.live=S.live.filter(x=>x.planId!==h.planId);renderView();toast('Your plan has ended');
}
async function authSend(){
  const A=S.auth,email=A.email.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){A.err='Enter a valid email address.';renderView();return;}
  A.status='sending';A.err='';renderView();
  const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){A.status='idle';A.err=error.message||'Could not send the link. Try again in a minute.';}else A.status='sent';
  renderView();
}
async function authPw(create){
  const A=S.auth,email=A.email.trim(),pw=A.pw;
  if(!/^\S+@\S+\.\S+$/.test(email)){A.err='Enter a valid email address.';renderView();return;}
  if(!pw||pw.length<6){A.err='Use a password with at least 6 characters.';renderView();return;}
  A.status='sending';A.err='';renderView();
  try{
    const r=create?await SB.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await SB.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;
    const u=r.data&&(r.data.session&&r.data.session.user);
    if(u){A.pw='';A.status='idle';if(!S.auth.user){S.auth.user=u;loadProfile();}renderView();return;}
    A.status='idle';
    if(create)A.err='Account created, but Supabase wants the email confirmed first. In Supabase turn off Authentication, Sign In / Providers, Email, Confirm email, then tap Sign in.';
  }catch(e){
    A.status='idle';
    const m=(e&&e.message)||'';
    A.err=/invalid login/i.test(m)?'Wrong email or password. If you are new, tap Create account.':/already registered/i.test(m)?'That email already has an account. Tap Sign in.':/rate limit/i.test(m)?'Too many emails sent. Use Email and password with Sign in, or wait a while.':m||'Could not sign in. Try again.';
  }
  renderView();
}
async function authOut(){
  await SB.auth.signOut();
  const A=S.auth;A.user=null;A.profile=null;A.editing=false;A.status='idle';A.file=null;A.preview='';A.err='';
  A.form={first_name:'',age:'',gender:'Woman',vibes:[],instagram:'',high_school:'',college:'',studied:'',industry:'',hometown:'',languages:''};S.me={...DEMO_ME,vibes:DEMO_ME.vibes.slice()};S.myReqs={};S.hostReqs=[];S.fol=new Set();S.posted=S.posted&&S.posted.real?null:S.posted;renderAll();loadLive();
}
async function loadProfile(){
  const A=S.auth;if(!A.user)return;
  const {data,error}=await SB.from('profiles').select('*').eq('id',A.user.id).maybeSingle();
  if(error){A.err='Could not load your profile. '+(error.message||'');renderAll();return;}
  A.profile=data;
  if(data&&data.role&&!S.role){S.role=data.role;S.tab=data.role==='host'?'home':'tonight';try{localStorage.setItem('pu_role',data.role);}catch(e){}}
  if(data){
    let url='';
    if(data.photo_path){const r=await SB.storage.from('avatars').createSignedUrl(data.photo_path,3600);url=(r&&r.data&&r.data.signedUrl)||'';}
    S.me={name:data.first_name,age:data.age,gender:data.gender,vibes:data.vibes||[],photo:url,real:true,shows:null};
    A.form={first_name:data.first_name,age:String(data.age),gender:data.gender,vibes:(data.vibes||[]).slice(),instagram:data.instagram||'',...Object.fromEntries(ABOUT.map(a=>[a[0],data[a[0]]||'']))};
    A.editing=false;
  }else{A.editing=true;S.tab='profile';}
  renderAll();
  loadLive();
  handlePending();
}
function handlePending(){
  const u=S.pendingU;if(!u||!S.auth.user)return;
  S.pendingU=null;try{history.replaceState(null,'',location.pathname);}catch(e){}
  if(u!==S.auth.user.id&&S.role)openUser(u);
}
async function saveProfile(){
  const A=S.auth,f=A.form,age=parseInt(f.age,10);
  const hasPhoto=!!(A.file||(A.profile&&A.profile.photo_path));
  if(!f.first_name.trim()){A.err='Add your first name.';renderView();return;}
  if(!(age>=18&&age<=99)){A.err='You must be 18 or older to use Pull Up.';renderView();return;}
  if(!hasPhoto){A.err='Add a clear photo of your face.';renderView();return;}
  A.saving=true;A.err='';renderView();
  try{
    let path=A.profile&&A.profile.photo_path||null;
    if(A.file){
      if(!/^image\//.test(A.file.type))throw new Error('Pick an image file.');
      if(A.file.size>3*1024*1024)throw new Error('That photo is over 3 MB. Pick a smaller one.');
      path=A.user.id+'/avatar';
      const up=await SB.storage.from('avatars').upload(path,A.file,{upsert:true,contentType:A.file.type});
      if(up.error)throw up.error;
    }
    const ig=(f.instagram||'').trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[/?#].*$/,'');
    if(ig&&!igOk(ig))throw new Error('That Instagram name looks wrong. Use letters, numbers, dots and underscores only.');
    const row={id:A.user.id,first_name:f.first_name.trim(),age,gender:f.gender,vibes:f.vibes,photo_path:path,updated_at:new Date().toISOString()};
    const about={};ABOUT.forEach(a=>{about[a[0]]=((f[a[0]]||'').trim().slice(0,60))||null;});
    let res=await SB.from('profiles').upsert({...row,...about,instagram:ig||null});
    if(res.error&&new RegExp(ABOUT.map(a=>a[0]).join('|'),'i').test(res.error.message||'')){
      if(ABOUT.some(a=>about[a[0]]))throw new Error('Saving these details needs the step 19 database update. Run supabase-step19-about.sql in Supabase.');
      res=await SB.from('profiles').upsert({...row,instagram:ig||null});
    }
    if(res.error&&/instagram/i.test(res.error.message||'')){
      if(ig)throw new Error('Instagram needs the step 5 database update first. Run supabase-step5-instagram.sql in Supabase.');
      res=await SB.from('profiles').upsert(row);
    }
    if(res.error)throw res.error;
    A.file=null;A.preview='';
    A.saving=false;await loadProfile();toast('Profile saved');return;
  }catch(e){A.err=(e&&e.message)||'Could not save. Try again.';}
  A.saving=false;renderView();
}
if(SB){
  SB.auth.getSession().then(r=>{const u=r&&r.data&&r.data.session&&r.data.session.user;if(u&&!S.auth.user){S.auth.user=u;loadProfile();}else if(!u)loadLive();});
  SB.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null;
    if(u&&(!S.auth.user||S.auth.user.id!==u.id)){S.auth.user=u;loadProfile();}
  });
}
renderAll();
setInterval(()=>{if(SB&&document.visibilityState==='visible')loadLive();},20000);
const mq=window.matchMedia('(min-width:900px)');
if(mq.addEventListener)mq.addEventListener('change',()=>renderAll());
})();
</script>
