<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>Pull Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: one phone-width app column, centered on desktop. Tabs: Tonight, Map, Trip, Safety. Riders choose; hosts post plans. */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#E3E8E1; --ink:#14201A; --ink-2:#51605A; --line:#CBD3CA;
  --accent:#9A5F08; --accent-ink:#FFFFFF; --accent-soft:#F1E2C6;
  --good:#1B7A4B; --good-soft:#D6EBDD; --bad:#C0352B; --bad-ink:#FFFFFF; --bad-soft:#F6D9D5; --me:#1769AA;
  --m-land:#E6EAE3; --m-park:#D2E3CC; --m-road:#FFFFFF; --m-major:#F6E9CF; --m-water:#BFD6E0; --m-text:#5C6A63; --m-halo:#E6EAE3;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B110F; --surface:#121A17; --surface-2:#1A2420; --ink:#EBF0EA; --ink-2:#98A79F; --line:#26332D;
    --accent:#EDB44E; --accent-ink:#1B1204; --accent-soft:#2B2311;
    --good:#4CC98A; --good-soft:#12301F; --bad:#FF6F61; --bad-ink:#1C0705; --bad-soft:#3A1714; --me:#5BB0F0;
    --m-land:#0F1613; --m-park:#14211A; --m-road:#1C2823; --m-major:#2A2A1E; --m-water:#0E2230; --m-text:#7C8C84; --m-halo:#0F1613;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B110F; --surface:#121A17; --surface-2:#1A2420; --ink:#EBF0EA; --ink-2:#98A79F; --line:#26332D;
  --accent:#EDB44E; --accent-ink:#1B1204; --accent-soft:#2B2311;
  --good:#4CC98A; --good-soft:#12301F; --bad:#FF6F61; --bad-ink:#1C0705; --bad-soft:#3A1714; --me:#5BB0F0;
  --m-land:#0F1613; --m-park:#14211A; --m-road:#1C2823; --m-major:#2A2A1E; --m-water:#0E2230; --m-text:#7C8C84; --m-halo:#0F1613;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line);position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo i{display:flex;gap:3px}
.logo i b{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.view{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.view>*{flex:none;width:100%;max-width:1040px;margin-inline:auto}
.sheet>*{flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px;font-weight:700;color:var(--ink-2);position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--accent)}
.tabs .dot{position:absolute;top:7px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--good)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:28px;line-height:1.05;font-weight:800}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
.hero{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rule{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--good-soft);color:var(--ink);font-size:13px}
.rule .ic{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:16/8.5;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 15% 100%,hsl(var(--h) 70% 45% / .55),transparent 60%),radial-gradient(90% 80% at 90% 0%,hsl(calc(var(--h) + 40) 60% 50% / .35),transparent 60%),linear-gradient(170deg,#101816,#1B2622)}
.thumb .car{position:absolute;left:50%;bottom:6%;width:62%;transform:translateX(-50%);opacity:.95}
.thumb .tl{position:absolute;top:10px;left:10px;right:110px;display:flex;gap:6px;flex-wrap:wrap}
.thumb .tr{position:absolute;top:10px;right:10px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:rgba(10,14,12,.62);color:#fff;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.tag.crew{background:var(--accent);color:var(--accent-ink);font-size:12px}
.play{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#101816;font-weight:700;font-size:12px}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.name{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.vbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;background:var(--good-soft);color:var(--good);font-size:11px;font-weight:700}
.vbadge.pending{background:var(--accent-soft);color:var(--accent)}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.rating .ic{color:var(--accent)}
.avs{display:flex}
.av{position:relative;display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);flex:none}
.avs .av+.av{margin-left:-8px}
.av svg.p{display:block;width:100%;height:100%;border-radius:50%}
.av .okb{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--good);color:var(--bg);display:grid;place-items:center;border:2px solid var(--surface)}
.disc{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.disc{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.disc{grid-template-columns:repeat(4,1fr)}}
.dtile{position:relative;aspect-ratio:9/15;border-radius:18px;overflow:hidden;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;--h:200;
  background:radial-gradient(120% 90% at 15% 100%,hsl(var(--h) 70% 45% / .6),transparent 60%),radial-gradient(90% 80% at 90% 0%,hsl(calc(var(--h) + 40) 60% 50% / .4),transparent 60%),linear-gradient(170deg,#101816,#1B2622);border:1px solid var(--line)}
.dtile .tvid{z-index:0}
.dtile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.05) 55%,rgba(0,0,0,.35));z-index:1;pointer-events:none}
.dtile>*{position:relative;z-index:2}
.dtile .dtop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;z-index:2}
.dtile .dface{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:34%;aspect-ratio:1;z-index:2;opacity:.95}
.dtile .dface .av,.dtile .dface .av img{width:100%!important;height:100%!important}
.dtile.hasv .dface{display:none}
.dtile .dn{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.05}
.dtile .ds{font-size:12px;opacity:.9;margin-top:3px}
.dtile .dm{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.dtile .dm .tag{font-size:10.5px;padding:3px 7px}
.dtile .dplay{position:absolute;right:10px;bottom:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:#101816;display:grid;place-items:center;z-index:2}
.igframe{width:100%;height:68vh;border:0;border-radius:14px;background:#fff}
.sbub-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.sbub-row::-webkit-scrollbar{display:none}
.sbub{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;color:var(--ink);font-size:12px;font-weight:600}
.sbub .ring{width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#F5C451,#ff7a59,#c93fa0,#F5C451)}
.sbub.seen .ring{background:var(--line)}
.sbub .ring>span{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:var(--surface-2);overflow:hidden}
.sbub .ring .av,.sbub .ring>span>.av{width:100%!important;height:100%!important;border:0;margin:0}
.sbub .ring img.p{width:100%;height:100%;object-fit:cover;border-radius:0}
.sbub .nm{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list{display:flex;flex-direction:column;gap:6px;min-height:180px;max-height:46vh;overflow:auto;padding:4px 2px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-left-radius:5px}
.bub small{display:block;font-size:10px;opacity:.7;margin-top:2px;white-space:normal}
.chat-in{display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{flex:1;resize:none;min-height:44px;max-height:110px}
.tvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;background:#000}
.thumb.hasv .car{display:none}
.thumb.hasv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 45%,rgba(0,0,0,.25));pointer-events:none}
.thumb.hasv .tl,.thumb.hasv .tr,.thumb.hasv .play{z-index:2}
.story{position:absolute;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff}
.story video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.story .shd{flex:none;padding:10px 12px 8px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(#000,#000)}
.story .sbar{height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.story .sbar i{display:block;height:100%;width:0;background:#fff}
.story .shead{display:flex;align-items:center;gap:10px}
.story .shead b{font-size:15px}.story .shead span.scar{font-size:12px;opacity:.85}
.story .shead .x{margin-left:auto;background:rgba(255,255,255,.14);color:#fff}
.story .svid{position:relative;flex:1;min-height:0;background:#000}
.story .tapl,.story .tapr{position:absolute;top:0;bottom:0;z-index:2}
.story .tapl{left:0;width:35%}.story .tapr{right:0;width:65%}
.story .sfoot{flex:none;display:flex;gap:10px;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#000;max-width:560px;width:100%;margin:0 auto}
.story .btn.ico{width:50px;min-width:50px;padding:0}
@media(min-width:760px){.story .shd,.story .svid,.story .sfoot{max-width:460px;width:100%;margin-left:auto;margin-right:auto}}
.story .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;z-index:1}
.vplayer{display:block;width:100%;max-height:62vh;border-radius:16px;background:#000}
.av img.p{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.tag.fit{background:var(--good);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pp{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px;min-width:0}
.pp b{overflow-wrap:anywhere}
.req{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sub{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.crewline{display:flex;align-items:center;gap:10px}
.legs{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--ink-2)}
.legs b{color:var(--ink);font-weight:700}
.legs .arrow{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--bad-ink)}
.btn.sm{padding:8px 12px;font-size:12px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* ---- action rows ---- */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;width:100%}
.actions .btn{width:100%}
.btn.act{gap:9px}
.btn.act span{display:inline-flex;align-items:center;gap:7px}
.btn.act small{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-2);font-size:11px;font-weight:800;color:var(--ink-2)}
.btn.act.on{border-color:var(--accent);color:var(--accent)}
.story .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(0,0,0,.4);backdrop-filter:blur(8px)}
.story .btn.ico.on{border-color:var(--accent);color:var(--accent)}
.sheet>.btn,.sheet>.actions{flex:none}
/* ---- button polish ---- */
.btn{min-height:50px;padding:13px 20px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.005em;position:relative;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent);
  transition:transform .12s ease,box-shadow .15s ease,filter .15s ease,background .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 6px -3px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none;border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn.ghost:active{background:var(--surface-2)}
.btn.danger{background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 88%,#fff),var(--bad));box-shadow:0 6px 16px -6px color-mix(in srgb,var(--bad) 70%,transparent)}
.btn.sm{min-height:38px;padding:8px 16px;font-size:13px;border-radius:999px}
.btn[disabled]{opacity:.4;box-shadow:none;filter:grayscale(.3);transform:none}
.chip{padding:8px 15px;font-size:13px;transition:transform .12s ease,background .15s ease,border-color .15s ease}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{box-shadow:0 4px 12px -5px color-mix(in srgb,var(--accent) 80%,transparent)}
.x{width:36px;height:36px;transition:transform .12s ease,background .15s ease}
.x:hover{background:var(--line)}
.x:active{transform:scale(.9)}
.play{box-shadow:0 4px 14px -4px rgba(0,0,0,.5);transition:transform .12s ease;padding:8px 14px 8px 10px;font-size:13px}
.play:active{transform:scale(.94)}
.seg button{transition:background .15s ease,color .15s ease}
.dtile{transition:transform .15s ease,box-shadow .2s ease}
.dtile:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(0,0,0,.6)}
.dtile:active{transform:scale(.97)}
.sbub:active .ring{transform:scale(.93)}
.sbub .ring{transition:transform .12s ease}
.two{gap:10px}
.sheet .btn+.btn,.panel .btn+.btn{margin-top:2px}
@media(prefers-reduced-motion:reduce){.btn,.chip,.x,.play,.dtile,.sbub .ring{transition:none}.btn:active,.chip:active,.dtile:hover,.dtile:active{transform:none}}
.mono{font-family:var(--f-mono);font-weight:700}
.plate{display:inline-block;padding:5px 11px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.06em}
.lmap.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.8)}
.lmap{height:260px;width:100%;background:var(--m-land);z-index:0}
.split .lmap{height:360px}
@media(min-width:900px){.split .lmap{height:520px}.lmap{height:300px}}
.leaflet-container{font-family:var(--f-body);font-size:12px}
.lpin{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:3px solid #fff;font-weight:800;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.lpin.event{background:#7A5AF8;color:#fff}.lpin.home{background:var(--good);color:#fff}.lpin.stop{background:var(--ink);color:var(--bg);width:26px;height:26px;font-size:11px}
.lpin.you{background:var(--me);color:#fff;width:18px;height:18px;border-width:3px}
.lpin.park{width:34px;height:34px;font-size:14px}
.lpin.me{background:#1769AA;width:16px;height:16px;border-width:3px;box-shadow:0 0 0 8px rgba(23,105,170,.25)}
.leaflet-tooltip{font-weight:700;border-radius:8px}
.map-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--m-land);position:relative}
svg.map{display:block;width:100%;height:auto}
.m-land{fill:var(--m-land)} .m-park{fill:var(--m-park)} .m-water{fill:var(--m-water)}
.m-road{stroke:var(--m-road);stroke-width:3;fill:none} .m-major{stroke:var(--m-major);stroke-width:6;fill:none}
.m-route-bg{stroke:var(--accent);stroke-opacity:.28;stroke-width:9;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m-route{stroke:var(--accent);stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m-trail{stroke:var(--ink-2);stroke-opacity:.6;stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.m-dev{stroke:var(--bad);stroke-width:3;stroke-dasharray:6 5;fill:none}
.m-text{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--m-halo);stroke-width:3px;stroke-linejoin:round}
.m-dist{font-family:var(--f-body);font-weight:700;letter-spacing:.14em;fill:var(--m-text);opacity:.75}
.m-fuzz{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1.5}
.hit{cursor:pointer}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.3}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}

.stop{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.stop .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);font-weight:700;font-size:12px;color:var(--accent);background:var(--surface)}
.stop.done .n{background:var(--good);border-color:var(--good);color:var(--bg)}
.stop.skip{opacity:.45}
.stop small{color:var(--ink-2);display:block}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.sw{width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.stepper b{min-width:18px;text-align:center;font-family:var(--f-mono)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2)}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.live{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.sos{padding:9px 16px;border-radius:999px;background:var(--bad);color:var(--bad-ink);font-weight:800;letter-spacing:.06em;font-size:13px}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12px}
.log li{display:flex;gap:8px;color:var(--ink-2)}
.log li b{font-family:var(--f-mono);font-weight:500;color:var(--ink-2);flex:none}
.log li.bad{color:var(--bad)}
.log li.good{color:var(--good)}
.status{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.status .btn{width:auto}
.empty{text-align:left;display:flex;flex-direction:column;gap:10px;padding:20px;border:1px dashed var(--line);border-radius:16px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}
.inp{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{width:100%;max-height:93%;background:var(--surface);border-radius:20px 20px 0 0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}

.x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}

async function sendChat(){

async function loadRequests(rows,mine){
  const A=S.auth;if(!SB||!A.user)return false;
  let changed=false;
  try{
    const mr=await SB.from('requests').select('id,plan_id,status').eq('rider_id',A.user.id);
    if(mr.error){S.reqOff=true;return false;}
    S.reqOff=false;
    const next={};
    for(const x of (mr.data||[])){
      const prev=S.myReqs[x.plan_id];
      const o={id:x.id,status:x.status,plate:prev&&prev.plate||null};
      if(x.status==='accepted'&&!o.plate){const pp=await SB.from('plan_private').select('plate').eq('plan_id',x.plan_id).maybeSingle();o.plate=(pp&&pp.data&&pp.data.plate)||null;}
      if(!prev||prev.status!==x.status){changed=true;const h=S.live.find(z=>z.planId===x.plan_id);if(prev&&h){if(x.status==='accepted')toast(h.name+' accepted your request');else if(x.status==='declined')toast(h.name+' passed on your request');}}
      if(o.plate){const h=S.live.find(z=>z.planId===x.plan_id);if(h)h.plate=o.plate;}
      next[x.plan_id]=o;
    }
    S.myReqs=next;
    if(mine){
      const q=cols=>SB.from('requests').select('*, rider:profiles!requests_rider_id_fkey('+cols+')').eq('plan_id',mine.planId).neq('status','cancelled').order('created_at',{ascending:true});
      let hr=await q('first_name,age,gender,vibes,photo_path,instagram');
      if(hr.error&&/instagram/i.test(hr.error.message||''))hr=await q('first_name,age,gender,vibes,photo_path');
      const list=(hr&&hr.data)||[];
      const paths=[...new Set(list.map(x=>x.rider&&x.rider.photo_path).filter(Boolean))],urls={};
      if(paths.length){const u=await SB.storage.from('avatars').createSignedUrls(paths,3600);((u&&u.data)||[]).forEach(z=>{if(z.signedUrl&&z.path)urls[z.path]=z.signedUrl;});}
      const before=S.hostReqs.length;
      S.hostReqs=list.filter(x=>x.rider).map(x=>({id:x.id,status:x.status,name:x.rider.first_name,age:x.rider.age,gender:x.rider.gender,vibes:x.rider.vibes||[],photo:urls[x.rider.photo_path]||null,ig:x.rider.instagram||null,friend:x.friend}));
      if(S.hostReqs.length>before)changed=true;
    }else S.hostReqs=[];
  }catch(e){S.reqOff=true;}
  return changed;
}

    people:h.crew.length+1+(r.draft.friendOn?1:0),trail:[stops[0].pos.slice()],log:[]};
  logT('Plan shared with '+(CONTACTS.filter(c=>S.settings.share[c.id]).map(c=>c.name).join(' and ')||'no contacts'));
  logT('Route locked. Any change alerts you.','good');

function tick(){
  const t=S.trip;if(!t||t.done){clearInterval(timer);return;}
  const now=performance.now(),dt=Math.min((now-last)/1000,0.5);last=now;
  const v=7*t.mult*dt;t.dist=Math.min(t.route.total,t.dist+v);t.travelled+=v;
  if(t.dev)t.devOff=Math.min(60,t.devOff+14*dt);else t.devOff=Math.max(0,t.devOff-30*dt);
  const c=tripCar();const lp=t.trail[t.trail.length-1];
  if(Math.abs(lp[0]-c.x)+Math.abs(lp[1]-c.y)>3)t.trail.push([c.x,c.y]);
  t.stops.forEach(s=>{if(!s.arrived&&!s.skipped&&t.dist>=s.at-0.5){s.arrived=true;if(s.kind!=='park'&&s.kind!=='home')logT('Arrived at '+s.name);if(s.kind==='home')logT('Dropped off at your place','good');}});
  if(!t.devAlerted&&t.dev&&t.devOff*KM>=S.settings.threshold){t.devAlerted=true;logT('Car is '+(t.devOff*KM).toFixed(1)+' km off route. Contacts alerted.','bad');openSheet('dev');}
  if(!t.ciDone&&S.settings.checkin&&t.dist/t.route.total>=0.4){startCheckin();}
  if(t.checkin&&!t.checkin.expired&&S.sheet==='checkin'){t.checkin.left-=dt;const e=$('#ciLeft');if(e)e.textContent=Math.max(0,Math.ceil(t.checkin.left));if(t.checkin.left<=0){t.checkin.expired=true;logT('No check-in reply. Contacts alerted.','bad');renderSheet();}}
  if(t.dist>=t.route.total&&!t.done){t.done=true;clearInterval(timer);S.rating=0;openSheet('done');renderTabs();}
  if(S.tab==='trip'&&S.role==='rider'){
    const m=$('#tripMap'),s=$('#tripStats'),p=$('#tripStops'),l=$('#tripLog');
    if(m)m.innerHTML=tripMapHTML();if(s)s.innerHTML=tripStatsHTML();if(p)p.innerHTML=tripStopsHTML();if(l)l.innerHTML=tripLogHTML();
  }
}

function sendHome(){
  const t=S.trip;if(!t||t.homing)return;
  const c=tripCar(),p=c.base;
  const horizFirst=p.dx!==0||p.dy===0;
  const start=[Math.round(p.x*10)/10,Math.round(p.y*10)/10];
  const mid=horizFirst?[HOME[0],start[1]]:[start[0],HOME[1]];
  const pts=[start];[mid,HOME].forEach(q=>{if(!same(q,pts[pts.length-1]))pts.push(q);});
  const total=pts.reduce((a,q,i)=>i?a+man(q,pts[i-1]):0,0);
  t.stops.forEach(s=>{if(!s.arrived&&s.kind!=='home')s.skipped=true;});
  const home=t.stops.find(s=>s.kind==='home');home.at=total;
  t.route={pts,at:[0,total],total};t.dist=0;t.homing=true;t.dev=false;t.devAlerted=false;t.devOff=0;
  logT('You chose "Take me home". Route changed to go straight to your place.','good');
}

function readVideoMeta(file){
  return new Promise(res=>{
    const v=document.createElement('video'),u=URL.createObjectURL(file);let done=false;
    const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);res(r);};
    v.preload='metadata';v.muted=true;
    v.onloadedmetadata=()=>fin({ok:true,duration:v.duration});
    v.onerror=()=>fin({ok:false});
    setTimeout(()=>fin({ok:false}),6000);
    v.src=u;
  });
}
async function pickVlog(file){
  const d=S.hostDraft;d.vlogErr='';d.vlogWarn='';
  if(d.vlogPreview){try{URL.revokeObjectURL(d.vlogPreview);}catch(e){}}
  d.vlogFile=null;d.vlogName='';d.vlogPreview='';
  if(!file){renderView();return;}
  if(!/^video\//.test(file.type||'')){d.vlogErr='Pick a video file.';renderView();return;}
  if(file.size>45*1024*1024){d.vlogErr='That video is over 45 MB. Record a shorter clip or at a lower quality.';renderView();return;}
  const m=await readVideoMeta(file);
  if(m.ok&&m.duration>62){d.vlogErr='That clip is '+Math.round(m.duration)+' seconds. Keep it under 60.';renderView();return;}
  if(!m.ok)d.vlogWarn='This video could not be read here. It may not play on every phone. MP4 works best.';
  d.vlogFile=file;d.vlogName=file.name;d.vlogPreview=URL.createObjectURL(file);
  renderView();
}

  S.publishing=true;renderView();
  try{
    const row={host_id:A.user.id,event:d.event,park_desc:d.park.trim().slice(0,120)||'Near the main gate',park_m:100,leaving_text:fmtTime(d.leaving),car:d.car.trim().slice(0,60),color:d.color.trim().slice(0,30),
      next_venue:d.v,house_offered:d.house,house_area:'Nearby',house_idx:Math.floor(Math.random()*HOUSES.length),seats:d.seats,friends_ok:d.friendsOk,friend_pref:d.friendPref,
      rules:d.rules.length?d.rules.slice():['Sober driver'],vibe:d.vibe.length?d.vibe.slice():['Chill'],
      crew:d.friends.map(f=>({n:(f.n||'Friend').trim().slice(0,40),g:f.g,a:Number(f.a)||27})),active:true};
    if(d.pickLL){row.pickup_lat=d.pickLL[0];row.pickup_lng=d.pickLL[1];}
    if(d.stopLL){row.stop_name=(d.stopName||'Next stop').slice(0,80);row.stop_lat=d.stopLL[0];row.stop_lng=d.stopLL[1];}
    let vlogPath=null;
    if(d.vlogFile){
      toast('Uploading your vlog…');
      const up=await SB.storage.from('vlogs').upload(A.user.id+'/vlog',d.vlogFile,{upsert:true,contentType:d.vlogFile.type||'video/mp4'});
      if(up.error)throw new Error('Vlog upload failed: '+(up.error.message||'try a smaller file'));
      vlogPath=A.user.id+'/vlog';
    }else{SB.storage.from('vlogs').remove([A.user.id+'/vlog']).catch(()=>{});}
    row.vlog_path=vlogPath;
    const off=await SB.from('plans').update({active:false}).eq('host_id',A.user.id).eq('active',true);
    if(off.error)throw off.error;
    let ins=await SB.from('plans').insert(row).select('id').single();
    if(ins.error&&/pickup_|stop_/.test(ins.error.message||'')){
      ['pickup_lat','pickup_lng','stop_name','stop_lat','stop_lng'].forEach(k=>delete row[k]);
      ins=await SB.from('plans').insert(row).select('id').single();
      if(!ins.error)toast('Posted without your pins. Run supabase-step11-places.sql to save real places.');
    }
    if(ins.error)throw ins.error;
    const pr=await SB.from('plan_private').insert({plan_id:ins.data.id,plate:d.plate.trim().toUpperCase().slice(0,20)});
    if(pr.error)throw pr.error;
    await loadLive();
    toast('Your plan is live');
  }catch(e){toast('Could not post: '+((e&&e.message)||'try again').slice(0,90));}
  S.publishing=false;renderView();
}
async function endPlan(){
  const h=S.posted;if(!h||!h.real)return;
  const r=await SB.from('plans').update({active:false}).eq('id',h.planId);
  if(r.error){toast('Could not end it: '+(r.error.message||'try again'));return;}
  if(h.vlogPath){SB.storage.from('vlogs').remove([h.vlogPath]).catch(()=>{});}
  S.posted=null;S.live=S.live.filter(x=>x.planId!==h.planId);renderView();toast('Your plan has ended');
}
async function authSend(){
  const A=S.auth,email=A.email.trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){A.err='Enter a valid email address.';renderView();return;}
  A.status='sending';A.err='';renderView();
  const {error}=await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){A.status='idle';A.err=error.message||'Could not send the link. Try again in a minute.';}else A.status='sent';
  renderView();
}
async function authPw(create){
  const A=S.auth,email=A.email.trim(),pw=A.pw;
  if(!/^\S+@\S+\.\S+$/.test(email)){A.err='Enter a valid email address.';renderView();return;}
  if(!pw||pw.length<6){A.err='Use a password with at least 6 characters.';renderView();return;}
  A.status='sending';A.err='';renderView();
  try{
    const r=create?await SB.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await SB.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;
    const u=r.data&&(r.data.session&&r.data.session.user);
    if(u){A.pw='';A.status='idle';if(!S.auth.user){S.auth.user=u;loadProfile();}renderView();return;}
    A.status='idle';
    if(create)A.err='Account created, but Supabase wants the email confirmed first. In Supabase turn off Authentication, Sign In / Providers, Email, Confirm email, then tap Sign in.';
  }catch(e){
    A.status='idle';
    const m=(e&&e.message)||'';
    A.err=/invalid login/i.test(m)?'Wrong email or password. If you are new, tap Create account.':/already registered/i.test(m)?'That email already has an account. Tap Sign in.':/rate limit/i.test(m)?'Too many emails sent. Use Email and password with Sign in, or wait a while.':m||'Could not sign in. Try again.';
  }
  renderView();
}
async function authOut(){
  await SB.auth.signOut();
  const A=S.auth;A.user=null;A.profile=null;A.editing=false;A.status='idle';A.file=null;A.preview='';A.err='';
  A.form={first_name:'',age:'',gender:'Woman',vibes:[],instagram:''};S.me={...DEMO_ME,vibes:DEMO_ME.vibes.slice()};S.myReqs={};S.hostReqs=[];S.fol=new Set();S.posted=S.posted&&S.posted.real?null:S.posted;renderAll();loadLive();
}
async function loadProfile(){
  const A=S.auth;if(!A.user)return;
  const {data,error}=await SB.from('profiles').select('*').eq('id',A.user.id).maybeSingle();
  if(error){A.err='Could not load your profile. '+(error.message||'');renderAll();return;}
  A.profile=data;
  if(data){
    let url='';
    if(data.photo_path){const r=await SB.storage.from('avatars').createSignedUrl(data.photo_path,3600);url=(r&&r.data&&r.data.signedUrl)||'';}
    S.me={name:data.first_name,age:data.age,gender:data.gender,vibes:data.vibes||[],photo:url,real:true,shows:null};
    A.form={first_name:data.first_name,age:String(data.age),gender:data.gender,vibes:(data.vibes||[]).slice(),instagram:data.instagram||''};
    A.editing=false;
  }else{A.editing=true;S.tab='safety';S.role='rider';}
  renderAll();
  loadLive();
}
async function saveProfile(){
  const A=S.auth,f=A.form,age=parseInt(f.age,10);
  const hasPhoto=!!(A.file||(A.profile&&A.profile.photo_path));
  if(!f.first_name.trim()){A.err='Add your first name.';renderView();return;}
  if(!(age>=18&&age<=99)){A.err='You must be 18 or older to use Pull Up.';renderView();return;}
  if(!hasPhoto){A.err='Add a clear photo of your face.';renderView();return;}
  A.saving=true;A.err='';renderView();
  try{
    let path=A.profile&&A.profile.photo_path||null;
    if(A.file){
      if(!/^image\//.test(A.file.type))throw new Error('Pick an image file.');
      if(A.file.size>3*1024*1024)throw new Error('That photo is over 3 MB. Pick a smaller one.');
      path=A.user.id+'/avatar';
      const up=await SB.storage.from('avatars').upload(path,A.file,{upsert:true,contentType:A.file.type});
      if(up.error)throw up.error;
    }
    const ig=(f.instagram||'').trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[/?#].*$/,'');
    if(ig&&!igOk(ig))throw new Error('That Instagram name looks wrong. Use letters, numbers, dots and underscores only.');
    const row={id:A.user.id,first_name:f.first_name.trim(),age,gender:f.gender,vibes:f.vibes,photo_path:path,updated_at:new Date().toISOString()};
    let res=await SB.from('profiles').upsert({...row,instagram:ig||null});
    if(res.error&&/instagram/i.test(res.error.message||'')){
      if(ig)throw new Error('Instagram needs the step 5 database update first. Run supabase-step5-instagram.sql in Supabase.');
      res=await SB.from('profiles').upsert(row);
    }
    if(res.error)throw res.error;
    A.file=null;A.preview='';
    A.saving=false;await loadProfile();toast('Profile saved');return;
  }catch(e){A.err=(e&&e.message)||'Could not save. Try again.';}
  A.saving=false;renderView();
}
if(SB){
  SB.auth.getSession().then(r=>{const u=r&&r.data&&r.data.session&&r.data.session.user;if(u&&!S.auth.user){S.auth.user=u;loadProfile();}else if(!u)loadLive();});
  SB.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null;
    if(u&&(!S.auth.user||S.auth.user.id!==u.id)){S.auth.user=u;loadProfile();}
  });
}
renderAll();
setInterval(()=>{if(SB&&document.visibilityState==='visible')loadLive();},20000);
const mq=window.matchMedia('(min-width:900px)');
if(mq.addEventListener)mq.addEventListener('change',()=>renderAll());
})();
</script>
